name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mma
          POSTGRES_PASSWORD: mma
          POSTGRES_DB: mma_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mma -d mma_test" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      MMA_DATABASE_URL: postgresql+psycopg://mma:mma@localhost:5432/mma_test
      MMA_MODEL_CACHE_DIR: /home/runner/.cache/mma-models
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      # Whisper, the Piper voice, the embedding model and the reranker (~400 MB) are cached between runs.
      - name: Cache local models
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/mma-models
          key: mma-models-${{ hashFiles('backend/app/core/config.py') }}
      - name: Lint
        run: |
          ruff check app tests migrations
          ruff format --check app tests migrations
      - name: Type check
        run: mypy app
      - name: Tests (real PostgreSQL, real local models, no paid API)
        run: pytest --cov=app --cov-report=term --cov-report=xml
      - name: Evaluation gate (OCR, speech, grounded Q&A, tools, prompt injection, memory)
        env:
          MMA_JWT_SECRET: test-secret-not-for-production-0123456789abcdef
          MMA_LLM_PROVIDER: local
          MMA_LOG_LEVEL: ERROR
          MMA_FILE_DIR: /tmp/mma-eval-files
        run: python -m app.cli evaluate --reset --gate --out /tmp/eval
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-report
          path: /tmp/eval
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Container images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t mma-api backend
      - run: docker build -t mma-web frontend

  terraform:
    name: Terraform (fmt, validate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  secrets-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Run the gitleaks CLI over the full history. (gitleaks-action scans "<first commit>^..HEAD",
      # which fails on a repository's very first push because the root commit has no parent.)
      - name: Scan full git history
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .
